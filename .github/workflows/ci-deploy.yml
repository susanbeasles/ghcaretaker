name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install explicit Cloudflare build-tool binaries
        run: npm rebuild esbuild workerd --ignore-scripts=false --foreground-scripts
      - name: Check source and deployment policy
        run: npm run check
      - name: Security tests
        run: npm test
      - name: Bundle Worker without publishing
        run: npm run build

  deploy:
    name: Deploy production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'susanbeasles/ghcaretaker' && vars.AUTO_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.WORKER_ORIGIN }}
    concurrency:
      group: ghcaretaker-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate production configuration and required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing production CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing production CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$WORKER_ORIGIN" || { echo '::error::Missing production WORKER_ORIGIN'; exit 1; }
          node scripts/check-config.mjs --production
      - name: Skip commits superseded on main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Commit has been superseded; skipping production deployment.'
          fi
      - name: Apply append-only audit migrations
        if: steps.head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: npm
          command: d1 migrations apply ghcaretaker-audit --remote
      - name: Deploy Worker
        if: steps.head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: npm
          command: deploy
      - name: Verify deployment discovery and auth boundary
        if: steps.head.outputs.current == 'true'
        env:
          WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN }}
        run: node scripts/smoke.mjs
